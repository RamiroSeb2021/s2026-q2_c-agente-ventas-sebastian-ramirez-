rules:
  proposal:
    - Keep proposals concise and focused on the current phase.
    - Record current repo reality separately from target design.
    - In interactive mode, ask product questions before writing a proposal when business rules or trade-offs are unclear.
  specs:
    - Use RFC 2119 keywords for requirements.
    - Include scenarios for natural-language query, SQL generation, table/text output, chart output, and file export.
    - Require semantic intent detection through an LLM, not hardcoded keyword routing.
  design:
    - Separate Streamlit UI, agent orchestration, SQL/MCP access, visualization, export, configuration, and sample data.
    - Use uv for Python dependency management and locking; Docker builds should install from pyproject.toml/uv.lock.
    - Keep AWS/Bedrock credentials outside source files and Docker images.
    - Explain connector choice if an MCP-compatible SQL connector is not used.
  tasks:
    - Group work into reviewable slices under the 400 changed-line budget when possible.
    - Do not include app implementation in SDD initialization tasks.
  apply:
    tdd: false
    test_command: ""
    constraints:
      - Do not create or modify cloud resources without explicit approval.
      - Prefer local sample data and read-only SQL during implementation.
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
    constraints:
      - Do not invent Streamlit, uv, Docker, or test commands until project files define them.
  archive:
    - Preserve archived OpenSpec changes as audit history.
    - Warn before merging destructive or scope-changing deltas.
