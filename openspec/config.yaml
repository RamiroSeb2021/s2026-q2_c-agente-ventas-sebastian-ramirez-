schema: spec-driven
project: s2026-q2_c-agente-ventas-sebastian-ramirez
initialized: 2026-06-06
persistence:
  mode: openspec+engram
  artifact_store: openspec+engram
session:
  execution_mode: interactive
  chained_pr_strategy: auto-forecast
  review_budget_changed_lines: 400
context: |
  Practical assignment to build an Agentic AI sales analysis app.
  Target UI is Streamlit and target packaging is Docker.
  The agent should answer natural-language questions over a SQL ventas table.
  Required ventas columns: id, vendedor, sede, producto, cantidad, precio, fecha.
  Use LangGraph, Strands, or LangChain with Amazon Bedrock available as LLM provider.
  Prefer MCP-compatible SQL/database connectors.
  Support text, table, chart, CSV, and Excel outputs.
  Current repo has agent/docs/config scaffolding only; no runnable app exists yet.
stack:
  detected:
    language: none-yet
    app_framework: none-yet
    package_manager: none-yet
    runtime: none-yet
    database: none-yet
    container: none-yet
  target:
    language: python
    package_manager: uv
    ui: streamlit
    agent_framework_options:
      - LangGraph
      - Strands
      - LangChain
    llm_provider: Amazon Bedrock
    database: SQLite sample database unless changed later
    sql_connector: MCP-compatible connector preferred
    visualization_options:
      - Plotly
      - Matplotlib
      - Altair
    exports:
      - CSV
      - Excel
    container: Docker
    docker_dependency_source: pyproject.toml and uv.lock
