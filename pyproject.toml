[project]
name = "sales-query-agent"
version = "0.1.0"
description = "Agentic AI sales analysis project scaffold"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.24",
    "faker>=40.21.0",
    "langgraph>=1.2.4",
    "mcp>=1.27.2",
    "mcp-server-sqlite>=2025.4.25",
    "openpyxl==3.1.5",
    "pandas==3.0.3",
    "plotly==6.4.0",
    "streamlit>=1.58.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
